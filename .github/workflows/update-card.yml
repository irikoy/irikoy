name: Update project card
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/card.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/card-project.svg
          git diff --cached --quiet || (git commit -m "Update star count" && git push)
